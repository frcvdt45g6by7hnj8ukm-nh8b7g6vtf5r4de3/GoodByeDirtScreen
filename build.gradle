plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${modloader}-${minecraft_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/${archives_base_name}.accesswidener")
    mixin {
        defaultRefmapName = 'goodbye_dirt_screen.refmap.json'
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

tasks.register('verifyMixinRefmaps') {
    dependsOn tasks.named('remapJar')
    doLast {
        def modJar = tasks.named('remapJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(modJar).withCloseable { zip ->
            def json = new groovy.json.JsonSlurper()
            def metadata = json.parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            metadata.mixins.each { declaration ->
                def configName = declaration instanceof String ? declaration : declaration.config
                def config = json.parse(zip.getInputStream(zip.getEntry(configName)))
                def entry = config.refmap ? zip.getEntry(config.refmap) : null
                if (entry == null) {
                    throw new GradleException("Missing refmap '${config.refmap}' declared by ${configName}")
                }
                if (!json.parse(zip.getInputStream(entry)).mappings) {
                    throw new GradleException("Empty refmap '${config.refmap}' in ${modJar.name}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyMixinRefmaps')
}
